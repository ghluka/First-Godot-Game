name: Build and Deploy Web

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-beta4
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot + export templates
        run: |
          GODOT_VERSION=4.7-beta4
          TEMPLATE_DIR=4.7.beta4
          GODOT_FILENAME="Godot_v${GODOT_VERSION}_linux.x86_64"
          TEMPLATES_FILENAME="Godot_v${GODOT_VERSION}_export_templates.tpz"
          BASE_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"

          wget -q "${BASE_URL}/${GODOT_FILENAME}.zip"
          wget -q "${BASE_URL}/${TEMPLATES_FILENAME}"

          unzip -q "${GODOT_FILENAME}.zip"
          mv "${GODOT_FILENAME}" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/${TEMPLATE_DIR}
          unzip -q "${TEMPLATES_FILENAME}" -d templates_tmp
          mv templates_tmp/templates/* ~/.local/share/godot/export_templates/${TEMPLATE_DIR}/

      - name: Build Web export
        run: |
          mkdir -p build/web
          godot --path mine-parkour --headless --verbose --export-release "Web" build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: Build
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Build
          path: build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build